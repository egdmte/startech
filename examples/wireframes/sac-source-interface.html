<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Button treatment wireframe for the first STARTECH SAC screen">
  <title>SAC button wireframe · STARTECH CAM</title>
  <style>
    :root {
      --ink: #080808;
      --muted: #626262;
      --desktop: #dedede;
      --surface: #efefef;
      --border: #bcbcbc;
      --focus: #005cff;
      --danger: #c5161d;
      --primary-top: #055cff;
      --primary-bottom: #5d7dfd;
      --secondary-top: #a9c0e9;
      --secondary-bottom: #c3d0e5;
    }

    * { box-sizing: border-box; }

    html { min-width: 320px; background: var(--desktop); }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background: var(--desktop);
      font-family: "Inter 28pt", Inter, Arial, Helvetica, sans-serif;
      font-size: 17px;
      line-height: 1.3;
    }

    button, select { color: inherit; font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }

    button:focus-visible, select:focus-visible, a:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 3px;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }

    .cam-frame {
      position: relative;
      min-height: calc(100vh - 47px);
      margin: 14px 30px 33px 26px;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
    }

    .wireframe-tag {
      position: absolute;
      top: 17px;
      left: 18px;
      padding: 5px 8px;
      color: #666;
      border: 1px solid #c8c8c8;
      border-radius: 5px;
      background: rgb(255 255 255 / 65%);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .08em;
    }

    .account-nav {
      position: absolute;
      z-index: 5;
      top: 12px;
      right: 16px;
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 5px;
      border: 1px solid #c8c8c8;
      border-radius: 8px;
      background: rgb(255 255 255 / 94%);
      box-shadow: 0 3px 14px rgb(0 0 0 / 10%);
    }

    .nav-action {
      min-height: 31px;
      padding: 5px 9px;
      color: #3f3f3f;
      border: 0;
      border-radius: 5px;
      background: transparent;
      cursor: pointer;
      font-size: 13px;
    }

    .nav-action:hover { color: #000; background: #ededed; }
    .nav-action.is-linked { color: #087a3f; font-weight: 700; }

    .source-panel {
      position: absolute;
      top: 52%;
      left: calc(50% + 18px);
      display: grid;
      width: min(578px, calc(100% - 48px));
      transform: translate(-50%, -50%);
    }

    .abort {
      position: absolute;
      top: -58px;
      left: 0;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 0 2px 6px;
      color: #ff4545;
      border: 0;
      border-left: 1px solid currentColor;
      background: transparent;
      cursor: pointer;
      font-size: 17px;
    }

    .abort:hover { color: #d80016; }

    .heading { margin-bottom: 32px; text-align: center; }
    .heading h1, .heading p { margin: 0; font-size: 17px; line-height: 1.25; }
    .heading h1 { font-weight: 700; }
    .heading p { margin-top: 4px; }

    .button-stack { display: grid; gap: 11px; }
    .button-stack form { display: grid; margin: 0; gap: 8px; }

    /* Clean translation of the supplied Figma/React export.
       Same visual values; no fixed 577.654px positioning or rotated wrapper. */
    .cam-action {
      position: relative;
      display: grid;
      width: 100%;
      min-height: 45px;
      place-items: center;
      padding: 9px 22px;
      overflow: hidden;
      border: 0;
      border-radius: 9px;
      cursor: pointer;
      font-size: 17px;
      line-height: 1.1;
      text-align: center;
      box-shadow:
        inset 0 2px 11.8px rgb(0 0 0 / 25%),
        0 0 7.6px rgb(0 0 0 / 25%);
      transition: filter 130ms ease, transform 130ms ease, box-shadow 130ms ease;
    }

    .cam-action::after {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      box-shadow: inset 0 1px 0 rgb(255 255 255 / 24%);
      content: "";
      pointer-events: none;
    }

    .cam-action--primary {
      color: #fff;
      background: linear-gradient(180deg, var(--primary-top), var(--primary-bottom));
      font-weight: 600;
      text-shadow: 0 1px 1px rgb(0 0 0 / 22%);
    }

    .cam-action--secondary {
      color: var(--ink);
      background: linear-gradient(180deg, var(--secondary-top), var(--secondary-bottom));
      font-weight: 500;
    }

    .cam-action:hover {
      filter: brightness(1.055) saturate(1.04);
      transform: translateY(-1px);
      box-shadow:
        inset 0 2px 9px rgb(0 0 0 / 21%),
        0 2px 9px rgb(0 0 0 / 27%);
    }

    .cam-action:active {
      filter: brightness(.96);
      transform: translateY(1px);
      box-shadow:
        inset 0 3px 12px rgb(0 0 0 / 31%),
        0 0 3px rgb(0 0 0 / 22%);
    }

    .action-content {
      position: relative;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 13px;
    }

    .action-content img { width: 24px; height: 24px; object-fit: contain; }

    .version-select {
      width: 100%;
      height: 36px;
      padding: 4px 10px;
      border: 1px solid #999;
      border-radius: 6px;
      background: #fff;
      font-size: 14px;
    }

    .back {
      display: inline-flex;
      justify-self: center;
      margin-top: 32px;
      padding: 0;
      color: var(--muted);
      border: 0;
      background: transparent;
      cursor: pointer;
      font-size: 17px;
    }

    .back:hover { color: var(--ink); text-decoration: underline; }

    .progress {
      position: absolute;
      right: 38px;
      bottom: 11px;
      left: 14px;
      height: 7px;
      overflow: hidden;
      border-radius: 999px;
      background: #bebebe;
      box-shadow: inset 0 1px 1px rgb(0 0 0 / 11%);
    }

    .progress span {
      display: block;
      width: 12%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #006a9e, #91aebb);
    }

    .toast {
      position: fixed;
      z-index: 20;
      right: 24px;
      bottom: 24px;
      width: min(370px, calc(100vw - 32px));
      padding: 13px 15px;
      color: #fff;
      border-radius: 7px;
      background: #111;
      box-shadow: 0 10px 28px rgb(0 0 0 / 24%);
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transform: translateY(10px);
      transition: opacity 150ms ease, transform 150ms ease;
    }

    .toast.is-visible { opacity: 1; transform: translateY(0); }

    @media (max-width: 560px) {
      .cam-frame { min-height: calc(100vh - 12px); margin: 6px; }
      .wireframe-tag { top: 10px; left: 10px; }
      .account-nav { top: 7px; right: 7px; }
      .account-nav .nav-action:first-child { display: none; }
      .nav-action { padding: 5px 7px; font-size: 11px; }
      .source-panel { top: 51%; left: 50%; width: calc(100% - 30px); }
      .abort { top: -52px; }
      .heading { margin-bottom: 24px; }
      .cam-action { min-height: 48px; padding-right: 13px; padding-left: 13px; }
      .progress { right: 14px; bottom: 14px; left: 14px; }
      .toast { right: 16px; bottom: 28px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="cam-frame">
    <span class="wireframe-tag">BUTTON WIREFRAME</span>

    <nav class="account-nav" aria-label="Non-functional example navigation">
      <button class="nav-action" type="button" data-demo="CAM">CAM</button>
      <button class="nav-action is-linked" type="button" data-demo="YAREN manager">YAREN connected</button>
      <button class="nav-action" type="button" data-demo="Log out">Log out</button>
    </nav>

    <section class="source-panel" aria-labelledby="source-title">
      <button class="abort" type="button" data-demo="Abort SAC"><span aria-hidden="true">←</span> Abort</button>

      <header class="heading">
        <h1 id="source-title">Select a target for the calibration.</h1>
        <p>Please provide a starting point for this calibration.</p>
      </header>

      <div class="button-stack" aria-label="Calibration starting points">
        <button class="cam-action cam-action--primary" type="button" data-source="Update from the car">
          <span class="action-content"><img src="../../startech_cam/static/assets/updatecar.png" alt=""><span>Update from the car</span></span>
        </button>

        <button class="cam-action cam-action--secondary" type="button" data-source="Use the default model">
          <span class="action-content"><img src="../../startech_cam/static/assets/default.png" alt=""><span>Use the default model</span></span>
        </button>

        <form action="#" data-demo-form>
          <button class="cam-action cam-action--secondary" type="submit" data-source="Copy an old version">
            <span class="action-content"><img src="../../startech_cam/static/assets/copy.png" alt=""><span>Copy an old version</span></span>
          </button>
          <label class="visually-hidden" for="previous-version">Version to copy</label>
          <select class="version-select" id="previous-version">
            <option>school-baseline-v4 · School baseline</option>
            <option>workshop-camera-v2 · Camera workshop</option>
            <option>race-day-2026-05-04 · Last race record</option>
          </select>
        </form>
      </div>

      <button class="back" type="button" data-demo="Go back">← Go back</button>
    </section>

    <div class="progress" role="progressbar" aria-label="SAC wireframe progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="12"><span></span></div>
  </main>

  <div class="toast" role="status" aria-live="polite">Wireframe only. No server request or vehicle command was sent.</div>

  <script>
    (() => {
      const toast = document.querySelector(".toast");
      let hideToast;

      const show = (label) => {
        window.clearTimeout(hideToast);
        toast.textContent = `${label}: wireframe only. No server request or vehicle command was sent.`;
        toast.classList.add("is-visible");
        hideToast = window.setTimeout(() => toast.classList.remove("is-visible"), 3000);
      };

      document.querySelectorAll("[data-source]").forEach((button) => {
        button.addEventListener("click", (event) => {
          event.preventDefault();
          show(button.dataset.source);
        });
      });

      document.querySelectorAll("[data-demo]").forEach((button) => {
        button.addEventListener("click", () => show(button.dataset.demo));
      });

      document.querySelector("[data-demo-form]").addEventListener("submit", (event) => event.preventDefault());
    })();
  </script>
</body>
</html>
