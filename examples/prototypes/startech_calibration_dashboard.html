<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Calibration Arrangement and Management Tool prototype">
  <title>CAM — STARTECH Calibration</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared/cam-ui.css">
  <link rel="stylesheet" href="startech_calibration_dashboard.css">
  <link rel="stylesheet" href="shared/motion.css">
  <script src="shared/motion.js" defer></script>
  <script src="startech_calibration_dashboard.js" defer></script>
</head>
<body>
  <main class="cam-frame" data-page>
    <section class="launch-panel" aria-labelledby="cam-title">
      <header class="launch-heading">
        <p id="cam-title">Welcome to Calibration Arrangement and Management Tool (CAM)</p>
        <strong>Select an option to begin.</strong>
      </header>

      <div class="launch-actions" aria-label="Calibration options">
        <button
          class="cam-action cam-action--primary"
          type="button"
          data-flow="sac"
          data-destination="sac-name.html"
          data-dialog-title="Service Assisted Calibration"
          data-dialog-copy="The SAC workflow will open the guided, component-based calibration experience."
        >
          Create a SAC (Service Assisted Calibration)
        </button>
        <button
          class="cam-action cam-action--secondary"
          type="button"
          data-flow="mac"
          data-dialog-title="Manual Assisted Calibration"
          data-dialog-copy="The MAC workflow will open the direct calibration editor for manually entered values."
        >
          Create a MAC (Manual Assisted Calibration)
        </button>
      </div>

      <button
        class="history-action"
        type="button"
        data-flow="history"
        data-dialog-title="Version history"
        data-dialog-copy="Version comparison, copying and export will be connected here."
      >
        Access version history <span aria-hidden="true">→</span>
      </button>
    </section>

    <footer class="cam-session" data-motion data-motion-delay="2" aria-live="polite">
      <span>Your session will expire in</span>
      <strong class="cam-session-time" id="session-time">15:00</strong>
    </footer>
  </main>

  <dialog class="cam-dialog" id="flow-dialog" aria-labelledby="dialog-title">
    <form method="dialog" class="cam-dialog__content">
      <h2 id="dialog-title">Prototype flow</h2>
      <p id="dialog-copy">This workflow will be designed next.</p>
      <button class="cam-action cam-action--primary cam-dialog__close" value="close">Close</button>
    </form>
  </dialog>

  <noscript>This prototype needs JavaScript for the session timer and flow previews.</noscript>
</body>
</html>
