<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Review a simulated STARTECH SAC calibration before export">
  <title>Review calibration — STARTECH CAM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared/cam-ui.css">
  <link rel="stylesheet" href="sac-finish.css">
  <link rel="stylesheet" href="shared/motion.css">
  <script src="shared/motion.js" defer></script>
  <script src="sac-finish-session.js" defer></script>
  <script src="sac-summary.js" defer></script>
</head>
<body>
  <main class="finish-shell" data-page>
    <aside class="finish-identity" aria-label="Current session">
      <header class="finish-welcome" data-motion data-motion-delay="1">
        <span>Welcome</span>
        <strong>Egemen Yusuf Kayra</strong>
      </header>

      <footer class="finish-session-footer" data-motion data-motion-delay="3">
        <img class="finish-school-logo" src="login/assets/school-logo.png" alt="STARTECH school mark" width="29" height="28">
        <div class="finish-session-status" aria-live="polite">
          <span class="finish-session-label">Your session will expire in</span>
          <div class="finish-timer" aria-label="Session expires in 15 minutes">
            <span class="finish-timer-part" id="timer-minutes">15</span>
            <span class="finish-timer-part" id="timer-seconds">00</span>
          </div>
        </div>
      </footer>
    </aside>

    <section class="finish-stage" aria-labelledby="summary-title">
      <div class="finish-summary-layout" data-motion data-motion-delay="2">
        <header class="finish-copy">
          <svg class="finish-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M19.43 12.98c.04-.32.07-.65.07-.98s-.03-.66-.07-.98l2.11-1.65a.5.5 0 0 0 .12-.64l-2-3.46a.5.5 0 0 0-.6-.22l-2.49 1a7.4 7.4 0 0 0-1.69-.98l-.38-2.65A.49.49 0 0 0 14 2h-4a.49.49 0 0 0-.5.42l-.38 2.65c-.61.25-1.17.58-1.69.98l-2.49-1a.5.5 0 0 0-.6.22l-2 3.46a.5.5 0 0 0 .12.64l2.11 1.65a7.2 7.2 0 0 0 0 1.96l-2.11 1.65a.5.5 0 0 0-.12.64l2 3.46a.5.5 0 0 0 .6.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.04.24.25.42.5.42h4c.25 0 .46-.18.5-.42l.38-2.65c.61-.25 1.17-.58 1.69-.98l2.49 1a.5.5 0 0 0 .6-.22l2-3.46a.5.5 0 0 0-.12-.64l-2.11-1.65ZM12 15.5A3.5 3.5 0 1 1 12 8a3.5 3.5 0 0 1 0 7.5Z"/>
          </svg>
          <h1 id="summary-title">Calibration is about to be created.</h1>
          <p id="summary-copy">Please check everything you did before creating a calibration.</p>
        </header>

        <div class="finish-summary-actions">
          <button class="cam-action cam-action--primary" id="create-calibration" type="button">Create</button>
          <button class="cam-action cam-action--secondary" id="go-back" type="button">Go back</button>
        </div>
        <p class="finish-action-message" id="summary-message" role="status" aria-live="polite"></p>
      </div>
    </section>
  </main>

  <noscript>This prototype needs JavaScript to assemble and download the calibration JSON.</noscript>
</body>
</html>
