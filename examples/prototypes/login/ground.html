<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="STARTECH restrained calibration testing reminder prototype">
  <title>Raise the car — STARTECH</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="ground.css">
  <link rel="stylesheet" href="../shared/motion.css">
  <script src="../shared/motion.js" defer></script>
  <script src="ground.js" defer></script>
</head>
<body>
  <main class="ground-page" data-page>
    <section class="illustration-panel" aria-label="Car preparation reminder">
      <div class="illustration-stage">
        <img
          class="ground-illustration"
          src="assets/grnd.png"
          alt="A STARTECH test car held above a dark work surface beside a warning sign"
          data-motion-illustration
        >
      </div>
    </section>

    <section class="instruction-panel" aria-labelledby="ground-title">
      <div class="instruction-copy" data-motion data-motion-delay="2">
        <h1 id="ground-title">
          Please remove your car from the ground<span class="title-second-line">during assisted calibration testing.</span>
        </h1>
        <button class="continue-action" type="button" data-motion-button>
          Got it <span aria-hidden="true">→</span>
        </button>
      </div>
    </section>

    <footer class="page-footer" data-motion data-motion-delay="3">
      <div class="session-status" aria-live="polite">
        <span class="session-label">Your session will expire in</span>
        <div class="timer" aria-label="Session expires in 15 minutes">
          <span class="timer-part" id="timer-minutes">15</span>
          <span class="timer-part" id="timer-seconds">00</span>
        </div>
      </div>
      <img
        class="school-logo"
        src="assets/school-logo.png"
        alt="STARTECH school mark"
        width="29"
        height="28"
      >
    </footer>
  </main>

  <noscript>This prototype needs JavaScript for navigation and the session timer.</noscript>
</body>
</html>
