<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="STARTECH temporary web-code access prototype">
  <title>Prove that you possess the code — STARTECH</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="access.css">
  <link rel="stylesheet" href="../shared/motion.css">
  <script src="../shared/motion.js" defer></script>
  <script src="access.js" defer></script>
</head>
<body>
  <main class="access-shell" data-page>
    <aside class="identity-panel" aria-label="Current session">
      <header class="welcome-copy" data-motion data-motion-delay="1">
        <span>Welcome</span>
        <strong>Egemen Yusuf Kayra</strong>
      </header>

      <footer class="session-footer" data-motion data-motion-delay="3">
        <img
          class="school-logo"
          src="assets/school-logo.png"
          alt="STARTECH school mark"
          width="29"
          height="28"
        >
        <div class="session-status" aria-live="polite">
          <span class="session-label">Your session will expire in</span>
          <div class="timer" aria-label="Session expires in 15 minutes">
            <span class="timer-part" id="timer-minutes">15</span>
            <span class="timer-part" id="timer-seconds">00</span>
          </div>
        </div>
      </footer>
    </aside>

    <section class="access-panel" aria-labelledby="access-title">
      <div class="access-content" data-motion data-motion-delay="2">
        <img class="access-icon" src="assets/email.png" alt="" width="39" height="39" data-motion-illustration>
        <h1 id="access-title">Prove that you possess the code.</h1>
        <p class="access-explanation">
          Open YAREN, select the 10th action and enter the code it outputted here. It will be disabled in 15 minutes.
        </p>

        <form class="code-form" novalidate>
          <div class="code-entry">
            <label class="visually-hidden" for="web-code">Temporary YAREN web code</label>
            <input
              id="web-code"
              name="webCode"
              type="text"
              inputmode="text"
              autocomplete="one-time-code"
              spellcheck="false"
              maxlength="20"
              aria-describedby="code-message"
              required
            >
            <button class="send-action" type="submit" aria-label="Verify web code" data-motion-button>
              <img src="assets/send.png" alt="" width="24" height="24">
            </button>
          </div>
          <p class="code-message" id="code-message" role="status" aria-live="polite"></p>
        </form>

        <button class="offline-action" type="button" data-motion-button>
          Continue without access to the car <span aria-hidden="true">→</span>
        </button>
      </div>

      <p class="reassurance" data-motion data-motion-delay="3">You can always change your mind.</p>
    </section>
  </main>

  <noscript>This prototype needs JavaScript for code validation and the session timer.</noscript>
</body>
</html>
