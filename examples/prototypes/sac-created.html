<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Simulated STARTECH SAC calibration download confirmation">
  <title>Calibration created — STARTECH CAM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared/cam-ui.css">
  <link rel="stylesheet" href="sac-finish.css">
  <link rel="stylesheet" href="shared/motion.css">
  <script src="shared/motion.js" defer></script>
  <script src="sac-finish-session.js" defer></script>
  <script src="sac-created.js" defer></script>
</head>
<body>
  <main class="finish-shell" data-page>
    <aside class="finish-identity" aria-label="Current session">
      <header class="finish-welcome" data-motion data-motion-delay="1">
        <span>Welcome</span>
        <strong>Egemen Yusuf Kayra</strong>
      </header>

      <footer class="finish-session-footer" data-motion data-motion-delay="3">
        <img class="finish-school-logo" src="login/assets/school-logo.png" alt="STARTECH school mark" width="29" height="28">
        <div class="finish-session-status" aria-live="polite">
          <span class="finish-session-label">Your session will expire in</span>
          <div class="finish-timer" aria-label="Session expires in 15 minutes">
            <span class="finish-timer-part" id="timer-minutes">15</span>
            <span class="finish-timer-part" id="timer-seconds">00</span>
          </div>
        </div>
      </footer>
    </aside>

    <section class="finish-stage" aria-labelledby="created-title">
      <div class="finish-result-layout" data-motion data-motion-delay="2">
        <header class="finish-copy">
          <span class="finish-icon finish-icon--success" aria-hidden="true">✓</span>
          <h1 id="created-title">Calibration created!</h1>
          <p>A new calibration with tag <span id="calibration-tag">------</span> has been created.</p>
          <p>There are other variables that could not be edited using Service Assisted Calibration.</p>
        </header>

        <div class="finish-result-actions">
          <button class="cam-action cam-action--primary" id="edit-with-mac" type="button">Edit with MAC</button>
          <button class="cam-action cam-action--secondary" id="sideload-to-pi" type="button">Sideload to Pi</button>
          <button class="cam-action cam-action--secondary" id="main-menu" type="button">Main Menu</button>
        </div>
        <p class="finish-action-message" id="created-message" role="status" aria-live="polite"></p>
      </div>
    </section>
  </main>

  <noscript>This prototype needs JavaScript to show the generated calibration tag.</noscript>
</body>
</html>
