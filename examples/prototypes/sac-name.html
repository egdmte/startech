<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Name a Service Assisted Calibration draft">
  <title>Name your SAC — STARTECH CAM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared/cam-ui.css">
  <link rel="stylesheet" href="shared/cam-page.css">
  <link rel="stylesheet" href="sac-name.css">
  <link rel="stylesheet" href="shared/motion.css">
  <script src="shared/motion.js" defer></script>
  <script src="sac-name.js" defer></script>
</head>
<body>
  <main class="cam-frame" data-page>
    <section class="cam-center-panel" aria-labelledby="naming-title">
      <form class="naming-form" novalidate data-motion data-motion-delay="1">
        <header class="cam-page-heading">
          <h1 id="naming-title">Please enter a name for this calibration.</h1>
          <p>
            Your legal name is used to determine the owner. Naming a calibration helps you to
            organize better, it does not affect how STARTECH references calibrations.
          </p>
        </header>

        <label class="visually-hidden" for="calibration-name">Calibration name</label>
        <input
          class="cam-input"
          id="calibration-name"
          name="calibrationName"
          type="text"
          maxlength="64"
          placeholder="MySAC"
          autocomplete="off"
          required
        >

        <div class="naming-actions">
          <button class="cam-action cam-action--primary" type="submit">Agree</button>
          <button class="cam-action cam-action--secondary" id="change-owner" type="button">
            Sign in under another name
          </button>
        </div>
        <p class="form-message" id="form-message" role="status" aria-live="polite"></p>
      </form>
    </section>

    <footer class="cam-workflow-footer" data-motion data-motion-delay="2">
      <div class="cam-session" aria-live="polite">
        <span>Your session will expire in</span>
        <strong class="cam-session-time" id="session-time">15:00</strong>
      </div>
      <div
        class="cam-progress"
        role="progressbar"
        aria-label="Service Assisted Calibration progress"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="16"
      >
        <span class="cam-progress__value" style="--cam-progress: 16%"></span>
      </div>
    </footer>
  </main>

  <noscript>This prototype needs JavaScript to validate and continue.</noscript>
</body>
</html>
