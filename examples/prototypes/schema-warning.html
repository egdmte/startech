<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="CAM calibration-schema warning states prototype">
  <title>Calibration warning — STARTECH CAM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared/cam-ui.css">
  <link rel="stylesheet" href="schema-warning.css">
  <link rel="stylesheet" href="shared/motion.css">
  <script src="shared/motion.js" defer></script>
  <script src="schema-warning.js" defer></script>
</head>
<body>
  <main class="warning-shell" data-page>
    <aside class="identity-panel" aria-label="Current session">
      <header class="welcome-copy" data-motion data-motion-delay="1">
        <span>Welcome</span>
        <strong>Egemen Yusuf Kayra</strong>
      </header>

      <footer class="session-footer" data-motion data-motion-delay="3">
        <img
          class="school-logo"
          src="login/assets/school-logo.png"
          alt="STARTECH school mark"
          width="29"
          height="28"
        >
        <div class="session-status" aria-live="polite">
          <span class="session-label">Your session will expire in</span>
          <div class="timer" aria-label="Session expires in 15 minutes">
            <span class="timer-part" id="timer-minutes">15</span>
            <span class="timer-part" id="timer-seconds">00</span>
          </div>
        </div>
      </footer>
    </aside>

    <section class="warning-panel" aria-labelledby="warning-title">
      <div class="warning-card-position">
      <article class="warning-card" id="warning-card" data-motion data-motion-delay="1">
        <!--
          FINAL ICON ASSETS:
          Add solid monochrome icons as login/assets/hand.svg and
          login/assets/gear.svg. The text glyph below is a layout-safe fallback;
          schema-warning.js switches its symbol for each warning state.
        -->
        <span class="status-icon" id="status-icon" aria-hidden="true" data-motion-illustration></span>

        <h1 id="warning-title"></h1>
        <div class="warning-copy" id="warning-copy"></div>
        <div class="warning-actions" id="warning-actions" aria-label="Warning actions"></div>
        <p class="prototype-message" id="prototype-message" role="status" aria-live="polite"></p>
      </article>
      </div>
    </section>
  </main>

  <noscript>This prototype needs JavaScript to display the selected schema warning state.</noscript>
</body>
</html>
