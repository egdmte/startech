<!doctype html>
<!--
  APPROVED DESIGN REFERENCE — DO NOT OVERWRITE DURING IMPLEMENTATION.
  KERİM / SAC / Camera / Stage 2 — Perspective
  Reconstructed from the user-supplied design dated 27 August 2026.
  Create a new versioned reference if the design changes.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KERİM · SAC Camera · Stage 2</title>
  <style>
    :root {
      color-scheme: light;
      --page: #dddddd;
      --surface: #f4f4f4;
      --ink: #111111;
      --line: #bcbcbc;
      --blue: #0864ff;
      --blue-light: #b9ccf0;
      --blue-light-bottom: #a7c0ed;
      --progress: #0879ae;
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }

    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 16px;
    }

    button, input { font: inherit; }

    .stage-shell {
      min-height: calc(100vh - 28px);
      margin: 14px 26px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: var(--surface);
      box-shadow: 0 1px 2px rgb(0 0 0 / 4%);
      display: grid;
      grid-template-rows: 1fr auto;
    }

    .stage-content {
      position: relative;
      left: -48px;
      width: min(850px, calc(100% - 44px));
      margin: 0 auto;
      padding: 204px 0 35px;
    }

    .stage-heading {
      margin-bottom: 72px;
      text-align: center;
    }

    .stage-heading h1 {
      margin: 0 0 9px;
      font-size: 17px;
      font-weight: 700;
      line-height: 1.2;
    }

    .stage-heading p {
      margin: 0;
      font-size: 16px;
      line-height: 1.32;
      overflow-wrap: anywhere;
    }

    .perspective-area {
      width: 506px;
      max-width: 100%;
      margin: 0 auto;
    }

    .frame-index {
      display: block;
      margin-bottom: 6px;
      font-size: 16px;
    }

    .perspective-editor {
      position: relative;
      width: 100%;
      aspect-ratio: 506 / 274;
      overflow: hidden;
      border: 1px solid #444444;
      background: #f1f1f1;
    }

    .perspective-editor svg {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      user-select: none;
    }

    .track-image { opacity: 0.56; }

    .perspective-polygon {
      fill: rgb(255 255 255 / 3%);
      stroke: #111111;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .perspective-point {
      fill: #050505;
      stroke: transparent;
      stroke-width: 10;
      cursor: grab;
      touch-action: none;
    }

    .perspective-point:active { cursor: grabbing; }

    .stage-actions {
      width: 543px;
      max-width: 100%;
      margin: 70px auto 0;
      display: grid;
      gap: 10px;
    }

    .stage-button {
      width: 100%;
      min-height: 46px;
      padding: 8px 18px;
      border: 0;
      border-radius: 8px;
      box-shadow: 0 0 8px rgb(0 0 0 / 26%), inset 0 2px 10px rgb(255 255 255 / 18%);
      cursor: pointer;
      color: #111111;
    }

    .stage-button--secondary {
      background: linear-gradient(180deg, var(--blue-light) 0%, var(--blue-light-bottom) 100%);
    }

    .stage-button--primary {
      background: linear-gradient(180deg, #3977ff 0%, #0062ed 100%);
      color: #ffffff;
      font-weight: 600;
    }

    .stage-button:hover,
    .stage-button:focus-visible {
      filter: brightness(1.035);
      outline: 2px solid rgb(23 104 255 / 28%);
      outline-offset: 2px;
    }

    .file-input {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      clip-path: inset(50%);
      white-space: nowrap;
    }

    .save-result {
      min-height: 18px;
      margin: 0;
      color: #4f4f4f;
      font-size: 13px;
      text-align: center;
    }

    .session-footer {
      display: flex;
      align-items: center;
      gap: 7px;
      min-height: 38px;
      padding: 0 18px 10px;
      font-size: 13px;
    }

    .session-footer strong {
      min-width: 39px;
      font-variant-numeric: tabular-nums;
    }

    .session-progress {
      height: 6px;
      flex: 1;
      overflow: hidden;
      border-radius: 999px;
      background: #bdbdbd;
    }

    .session-progress span {
      display: block;
      width: 33.333%;
      height: 100%;
      background: linear-gradient(90deg, var(--progress) 0%, var(--progress) 75%, #87a8ba 100%);
    }

    @media (max-width: 900px) {
      .stage-content { left: 0; }
    }

    @media (max-width: 720px) {
      .stage-shell { min-height: calc(100vh - 16px); margin: 8px; }
      .stage-content { width: calc(100% - 30px); max-width: 560px; min-width: 0; padding-top: 38px; }
      .stage-heading { margin-bottom: 38px; }
      .stage-heading p { font-size: 14px; }
      .stage-actions { margin-top: 38px; }
      .session-footer { flex-wrap: wrap; }
      .session-progress { order: 3; flex-basis: 100%; }
    }
  </style>
</head>
<body>
  <main class="stage-shell">
    <section class="stage-content" aria-labelledby="stage-title">
      <header class="stage-heading">
        <h1 id="stage-title">Step 2 - Perspective</h1>
        <p>Set up perspective for the camera to follow. The perspective must be a trapezoid or a rectangle.<br>
          Rectangle shapes crop the footage while trapezoids set bird-eye perspectives.</p>
      </header>

      <div class="perspective-area">
        <span class="frame-index" id="frame-index">Index 0</span>
        <div class="perspective-editor">
          <svg id="perspective-svg" viewBox="0 0 506 274" role="img" aria-label="Draggable perspective shape">
            <image class="track-image" id="track-image" x="0" y="0" width="506" height="274" preserveAspectRatio="xMidYMid slice"></image>
            <polygon class="perspective-polygon" id="perspective-polygon" points="55,6 461,6 500,268 10,268"></polygon>
            <circle class="perspective-point" data-point="0" cx="55" cy="6" r="5.5" tabindex="0" aria-label="Top-left perspective point"></circle>
            <circle class="perspective-point" data-point="1" cx="461" cy="6" r="5.5" tabindex="0" aria-label="Top-right perspective point"></circle>
            <circle class="perspective-point" data-point="2" cx="10" cy="268" r="5.5" tabindex="0" aria-label="Bottom-left perspective point"></circle>
            <circle class="perspective-point" data-point="3" cx="500" cy="268" r="5.5" tabindex="0" aria-label="Bottom-right perspective point"></circle>
          </svg>
        </div>
      </div>

      <div class="stage-actions">
        <button class="stage-button stage-button--secondary" id="add-frame" type="button">Add new frame (index 1)</button>
        <button class="stage-button stage-button--secondary" id="upload-button" type="button">Upload a track photo</button>
        <input class="file-input" id="track-upload" type="file" accept="image/*" aria-label="Upload a track photo">
        <button class="stage-button stage-button--primary" id="save-button" type="button">OK</button>
        <p class="save-result" id="save-result" role="status" aria-live="polite"></p>
      </div>
    </section>

    <footer class="session-footer">
      <span>Your session will expire in</span>
      <strong>15:00</strong>
      <div class="session-progress" aria-hidden="true"><span></span></div>
    </footer>
  </main>

  <script>
    const svg = document.querySelector('#perspective-svg');
    const polygon = document.querySelector('#perspective-polygon');
    const pointElements = [...document.querySelectorAll('.perspective-point')];
    const frameLabel = document.querySelector('#frame-index');
    const addFrameButton = document.querySelector('#add-frame');
    const uploadButton = document.querySelector('#upload-button');
    const uploadInput = document.querySelector('#track-upload');
    const trackImage = document.querySelector('#track-image');
    const saveResult = document.querySelector('#save-result');

    const defaultPoints = () => [
      { x: 55, y: 6 },
      { x: 461, y: 6 },
      { x: 10, y: 268 },
      { x: 500, y: 268 }
    ];

    const frames = [defaultPoints()];
    let activeFrame = 0;
    let activePoint = null;

    function render() {
      const points = frames[activeFrame];
      const displayOrder = [points[0], points[1], points[3], points[2]];
      polygon.setAttribute('points', displayOrder.map((point) => `${point.x},${point.y}`).join(' '));
      pointElements.forEach((element, index) => {
        element.setAttribute('cx', points[index].x);
        element.setAttribute('cy', points[index].y);
      });
      frameLabel.textContent = `Index ${activeFrame}`;
      addFrameButton.textContent = `Add new frame (index ${frames.length})`;
    }

    function svgPosition(event) {
      const rect = svg.getBoundingClientRect();
      return {
        x: Math.max(6, Math.min(500, (event.clientX - rect.left) * 506 / rect.width)),
        y: Math.max(6, Math.min(268, (event.clientY - rect.top) * 274 / rect.height))
      };
    }

    function movePoint(index, position) {
      const points = frames[activeFrame];
      const isLeft = index === 0 || index === 2;
      const partnerX = points[isLeft ? index + 1 : index - 1].x;
      const x = isLeft
        ? Math.min(position.x, partnerX - 20)
        : Math.max(position.x, partnerX + 20);

      const isTop = index < 2;
      const oppositeY = points[isTop ? index + 2 : index - 2].y;
      const y = isTop
        ? Math.min(position.y, oppositeY - 20)
        : Math.max(position.y, oppositeY + 20);

      points[index] = { x: Math.round(x), y: Math.round(y) };
      points[isTop ? 1 - index : 5 - index].y = Math.round(y);
      render();
    }

    pointElements.forEach((element) => {
      element.addEventListener('pointerdown', (event) => {
        activePoint = Number(element.dataset.point);
        element.setPointerCapture(event.pointerId);
      });
      element.addEventListener('pointermove', (event) => {
        if (activePoint === Number(element.dataset.point)) movePoint(activePoint, svgPosition(event));
      });
      element.addEventListener('pointerup', () => { activePoint = null; });
      element.addEventListener('pointercancel', () => { activePoint = null; });
      element.addEventListener('mousedown', (event) => {
        activePoint = Number(element.dataset.point);
        event.preventDefault();
      });
    });

    window.addEventListener('mousemove', (event) => {
      if (activePoint !== null) movePoint(activePoint, svgPosition(event));
    });
    window.addEventListener('mouseup', () => { activePoint = null; });

    addFrameButton.addEventListener('click', () => {
      frames.push(defaultPoints());
      activeFrame = frames.length - 1;
      saveResult.textContent = '';
      render();
    });

    uploadButton.addEventListener('click', () => uploadInput.click());
    uploadInput.addEventListener('change', () => {
      const file = uploadInput.files && uploadInput.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.addEventListener('load', () => trackImage.setAttribute('href', reader.result));
      reader.readAsDataURL(file);
    });

    document.querySelector('#save-button').addEventListener('click', () => {
      saveResult.textContent = `${frames.length} perspective frame${frames.length === 1 ? '' : 's'} ready.`;
    });

    render();
  </script>
</body>
</html>
