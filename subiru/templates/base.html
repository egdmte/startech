<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ŞUBİRU</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <h1>ŞUBİRU</h1>
    <p class="subtitle">Şununla bir uğraşsan — the enforcement screen</p>
  </header>
  {% with messages = get_flashed_messages() %}
    {% if messages %}
      <ul class="flashes">
        {% for message in messages %}
          <li>{{ message }}</li>
        {% endfor %}
      </ul>
    {% endif %}
  {% endwith %}
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
