{% extends "base.html" %}
{% block content %}

<h2>Edit: {{ task.title }}</h2>
<form method="post">
  <label>Title <input type="text" name="title" value="{{ task.title }}" required></label>
  <label>Owner
    <select name="owner">
      {% for owner in owners %}
        <option value="{{ owner }}" {% if owner == task.owner %}selected{% endif %}>{{ owner }}</option>
      {% endfor %}
    </select>
  </label>
  <label>Depends on
    <select name="depends_on" multiple>
      {% for other in other_tasks %}
        <option value="{{ other.id }}" {% if other.id in task.depends_on %}selected{% endif %}>{{ other.title }}</option>
      {% endfor %}
    </select>
  </label>
  <label>Notes <textarea name="notes">{{ task.notes }}</textarea></label>
  <button type="submit">Save</button>
</form>
<p><a href="{{ url_for('index') }}">Back to board</a></p>

{% endblock %}
