; Select a project-local Python command without changing Webots preferences.
; Windows uses the Python launcher because `python` may be the Store alias.

[environment variables for Windows]
STARTECH_WEBOTS_PYTHON = py

[environment variables for Linux]
STARTECH_WEBOTS_PYTHON = python3

[environment variables for macOS]
STARTECH_WEBOTS_PYTHON = python3

[python]
COMMAND = $(STARTECH_WEBOTS_PYTHON)
