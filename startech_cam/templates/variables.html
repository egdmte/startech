{% extends "base.html" %}
{% block title %}{{ t('Variable manager') }}{% endblock %}
{% block content %}
<section class="document-editor">
  <header class="section-heading">
    <h1>{{ t('Variable management') }}</h1>
    <p>{{ t('Edit the merged v2 JSON directly. Invalid values will be rejected.') }}</p>
  </header>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <textarea class="code-input document-input" name="document_json" spellcheck="false">{{ document_json }}</textarea>
    <div class="editor-actions">
      <button class="primary-button" type="submit">{{ reicon('shield-check') }}<span>{{ t('Validate and save') }}</span></button>
      <a class="secondary-button" href="{{ url_for('cam.summary', workflow='mac', draft_id=draft_id) }}">{{ reicon('check') }}<span>{{ t('Review summary') }}</span></a>
    </div>
  </form>
</section>
{% endblock %}
